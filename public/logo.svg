<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 150" width="100%" height="100%">
    <defs>
        <linearGradient id="gopc-accent" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#0066ff"/>
            <stop offset="100%" stop-color="#00d2ff"/>
        </linearGradient>
        <linearGradient id="navy-text" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#0a192f"/>
            <stop offset="100%" stop-color="#0f2b5c"/>
        </linearGradient>
    </defs>
    <!-- Background rounded card (clean solid white) -->
    <rect x="0" y="0" width="480" height="150" rx="14" fill="#ffffff"/>
    
    <!-- High-tech circuit / microchip icon emblem next to GOPC -->
    <g transform="translate(32, 28)">
        <!-- Outer hexagon / tech polygon -->
        <polygon points="34,4 62,20 62,54 34,70 6,54 6,20" fill="none" stroke="#0a192f" stroke-width="3.5" stroke-linejoin="round"/>
        <polygon points="34,14 54,25 54,49 34,60 14,49 14,25" fill="#0a192f" opacity="0.08"/>
        <!-- Inner Power / PC Core circuit node -->
        <circle cx="34" cy="37" r="9" fill="url(#gopc-accent)"/>
        <!-- Circuit traces -->
        <line x1="34" y1="4" x2="34" y2="18" stroke="#0066ff" stroke-width="3" stroke-linecap="round"/>
        <line x1="62" y1="54" x2="50" y2="46" stroke="#0066ff" stroke-width="2.5" stroke-linecap="round"/>
        <line x1="6" y1="54" x2="18" y2="46" stroke="#0066ff" stroke-width="2.5" stroke-linecap="round"/>
        <line x1="34" y1="70" x2="34" y2="56" stroke="#0066ff" stroke-width="3" stroke-linecap="round"/>
    </g>

    <!-- Main Bold Brand Typography: GOPC -->
    <text x="116" y="80" 
          font-family="-apple-system, BlinkMacSystemFont, 'Montserrat', 'Segoe UI', 'Arial Black', sans-serif" 
          font-size="62" 
          font-weight="900" 
          letter-spacing="1.5" 
          fill="url(#navy-text)">GOPC</text>

    <!-- Tech dot / power accent on top of PC -->
    <circle cx="334" cy="40" r="5" fill="#0066ff"/>

    <!-- Subtle circuit accent line separating title & subtitle -->
    <line x1="118" y1="96" x2="435" y2="96" stroke="#0066ff" stroke-width="2" stroke-linecap="round" opacity="0.85"/>
    <circle cx="118" cy="96" r="3" fill="#0066ff"/>
    <circle cx="435" cy="96" r="3" fill="#0066ff"/>

    <!-- Clean Subtitle: CUSTOMIZE YOUR OWN PC -->
    <text x="120" y="118" 
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
          font-size="13.5" 
          font-weight="700" 
          letter-spacing="5.2" 
          fill="#1e3a8a">CUSTOMIZE YOUR OWN PC</text>
</svg>
